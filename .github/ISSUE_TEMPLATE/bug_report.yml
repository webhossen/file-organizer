name: Bug report
description: Report a reproducible problem with File Organizer
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please redact personal paths
        and never paste secrets or tokens.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `file-organizer --version`.
      placeholder: file-organizer 1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version.
      placeholder: Windows 11, Python 3.13
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and folder layout
      description: The command you ran and a short tree of the folder involved.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full output and any traceback.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this report.
          required: true
        - label: I reproduced the problem with the latest release.
          required: true
